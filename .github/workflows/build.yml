name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write     # membuat Release + unggah APK
  issues: write       # melaporkan log bila build gagal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Password kunci hanya lewat environment, tidak pernah ditulis ke repo.
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Kunci disimpan sebagai GitHub Secret (base64), bukan di repo.
      # Cara menyiapkan/memulihkan: docs/KUNCI-TANDA-TANGAN.md
      - name: Pulihkan kunci tanda tangan dari Secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 belum diisi. Lihat docs/KUNCI-TANDA-TANGAN.md"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD belum diisi."
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/keystore/presensi.p12
          test -s app/keystore/presensi.p12 || { echo "::error::Kunci gagal di-decode"; exit 1; }
          echo "Sidik jari kunci penanda tangan (untuk dicatat di catatan rilis):"
          keytool -list -v -keystore app/keystore/presensi.p12 -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-presensi}" \
            | grep -E "Alias name:|SHA256:"

      - name: Build APK rilis
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Pastikan APK benar-benar ditandatangani
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK rilis bertanda tangan tidak ditemukan (kemungkinan signing config tidak aktif)."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true
          fi

      # Kunci tidak dibiarkan tertinggal di runner.
      - name: Hapus kunci dari runner
        if: always()
        run: rm -f app/keystore/presensi.p12

      - name: Siapkan berkas APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Presensi-SMKN1-Marancar-v1.2.apk"
          ls -lh dist

      - name: Unggah artefak build
        uses: actions/upload-artifact@v4
        with:
          name: apk-presensi
          path: dist/*.apk
          retention-days: 90

      - name: Buat Release berisi APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Presensi SMKN 1 Marancar v1.2.${{ github.run_number }}
          body: |
            APK siap pasang (Android 10 ke atas).

            ## ⚠️ WAJIB DIBACA — kunci tanda tangan diganti
            Mulai v1.2 aplikasi ditandatangani dengan **kunci baru**. Android tidak mengizinkan
            pembaruan lintas kunci, jadi:

            1. **Ekspor dulu** rekap dari aplikasi lama (menu Rekap → Ekspor CSV) agar riwayat tidak hilang.
            2. **Uninstall** aplikasi Presensi versi lama.
            3. Pasang APK v1.2 di bawah, lalu impor ulang daftar siswa (Excel/CSV).

            Alasan: kunci tanda tangan v1.0–v1.1 sempat bocor ke repo publik sehingga
            tidak lagi layak dipakai. Rincian ada di `docs/KUNCI-TANDA-TANGAN.md`.

            Panduan lengkap ada di folder `docs/` repositori ini.
          files: dist/*.apk
          fail_on_unmatched_files: true

      # Bila build gagal, 250 baris log terakhir dibuat sebagai Issue
      # supaya bisa diperiksa tanpa membuka tab Actions.
      - name: Laporkan kegagalan build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build-log.txt ]; then tail -n 250 build-log.txt > err.txt; else echo "Tidak ada log build." > err.txt; fi
          gh issue create --title "Build gagal (run #${{ github.run_number }})" --body-file err.txt || true
